        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Aktywności]
      operationId: deleteActivity
      summary: Usunięcie aktywności (tylko właściciel)
      x-owner: Kacper
      responses:
        '204':
          description: Aktywność usunięta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /activities/{activityId}/share:
    parameters:
