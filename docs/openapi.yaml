    put:
      tags: [Aktywności]
      operationId: shareActivity
      summary: Udostępnij aktywność
      description: |
        Aktywności są domyślnie prywatne. Po udostępnieniu widać je na profilu właściciela i na osi czasu jego
        obserwujących. Tylko właściciel; ponowne udostępnienie nic nie zmienia.
      x-owner: Kacper
      responses:
        '204':
