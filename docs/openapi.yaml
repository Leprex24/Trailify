        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Aktywności]
      operationId: unshareActivity
      summary: Cofnij udostępnienie aktywności
      description: Aktywność znów widzi tylko właściciel, a wpis znika z osi czasu.
      x-owner: Kacper
      responses:
        '204':
          description: Aktywność jest prywatna
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /activities/{activityId}/points:
    parameters:
