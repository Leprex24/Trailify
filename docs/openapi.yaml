          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token dostępu z Supabase Auth
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Numer strony, liczony od 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Liczba elementów na stronie
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PoiId:
      name: poiId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Niepoprawne dane (`VALIDATION_ERROR`), szczegóły w `fieldErrors`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Brak lub nieprawidłowy token (`UNAUTHORIZED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Brak uprawnień (`FORBIDDEN`) albo konto zablokowane (`ACCOUNT_BLOCKED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Zasób nie istnieje lub nie jest widoczny dla użytkownika (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflikt, np. duplikat (`CONFLICT`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stały kod błędu do obsługi w aplikacji
          example: VALIDATION_ERROR
        message:
          type: string
          description: Opis błędu dla programisty
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: name
              message:
                type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    ActivityType:
      type: string
      enum: [CYCLING, RUNNING, WALKING]
    PoiCategory:
      type: string
      enum: [VIEWPOINT, NATURE, HISTORIC, CULTURE, RECREATION, OTHER]
      default: OTHER
      description: Widoczna tylko na karcie punktu (na mapie wszystkie punkty wyglądają tak samo)
    PoiStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    Role:
      type: string
      enum: [USER, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, BLOCKED]
    LatLng:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    RoutePlanRequest:
      type: object
      required: [profile, points]
      properties:
        profile:
          $ref: '#/components/schemas/ActivityType'
        points:
          type: array
          minItems: 2
          maxItems: 25
          description: Kolejne punkty trasy
          items:
            $ref: '#/components/schemas/LatLng'
    MapLayerLines:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          description: Każda linia to lista punktów [szerokość, długość] zaokrąglonych do 5 miejsc po przecinku
          items:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number, format: double }
    RoutePlan:
      type: object
      required: [distance, durationSeconds, geometry]
      properties:
        distance: { type: number, format: double, description: Metry }
        durationSeconds: { type: integer, description: Szacowany czas przejścia }
        geometry:
          $ref: '#/components/schemas/GeoJsonLineString'
    GeoJsonLineString:
      type: object
      description: 'GeoJSON LineString, współrzędne w kolejności [longitude, latitude, altitude?]'
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 3
            items:
              type: number
              format: double
          example: [[22.5684, 51.2465], [22.5701, 51.2480]]
    Photo:
      type: object
      required: [id, url]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string, format: uri }
    PhotoInput:
      type: object
      required: [storageKey, url]
      properties:
        storageKey:
          type: string
          description: Ścieżka pliku w Storage, zaczyna się od identyfikatora użytkownika
          example: 3f1c2b7e-0000-0000-0000-000000000000/9a1b.jpg
        url:
          type: string
          format: uri
    UserSummary:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
    ProfileStats:
      type: object
      required: [totalDistance, activityCount, routeCount, collectedPoiCount, followerCount, followingCount]
      properties:
        totalDistance:
          type: number
          format: double
          description: Łączny dystans aktywności w metrach
        activityCount: { type: integer }
        routeCount:
          type: integer
          description: Liczba publicznych tras
        collectedPoiCount: { type: integer }
        followerCount: { type: integer }
        followingCount: { type: integer }
    PublicStats:
      type: object
      required: [totalDistance, routeCount, followerCount, followingCount]
      properties:
        totalDistance: { type: number, format: double, description: Łączny dystans w metrach }
        routeCount: { type: integer, description: Liczba publicznych tras }
        followerCount: { type: integer }
        followingCount: { type: integer }
    PublicProfile:
      type: object
      required: [id, displayName, isPrivate, isMe, isFollowing]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        backgroundUrl: { type: string, format: uri, nullable: true }
        isPrivate: { type: boolean }
        isMe: { type: boolean }
        isFollowing: { type: boolean, description: Czy zalogowany użytkownik obserwuje ten profil }
        stats:
          nullable: true
          description: null, gdy profil jest prywatny i nie należy do oglądającego
          allOf:
            - $ref: '#/components/schemas/PublicStats'
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserSummary'
    Profile:
      type: object
      required: [id, email, displayName, isPrivate, role, createdAt, stats]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        backgroundUrl: { type: string, format: uri, nullable: true }
        isPrivate:
          type: boolean
          description: Profil prywatny, inni widzą tylko nazwę, avatar i tło
        role:
          $ref: '#/components/schemas/Role'
        createdAt: { type: string, format: date-time }
        stats:
          $ref: '#/components/schemas/ProfileStats'
    ProfileUpdate:
      type: object
      description: Pola nieprzesłane pozostają bez zmian. `avatarUrl` albo `backgroundUrl` = null usuwa zdjęcie.
      properties:
        displayName: { type: string, minLength: 2, maxLength: 50 }
        avatarUrl: { type: string, format: uri, nullable: true }
        backgroundUrl: { type: string, format: uri, nullable: true }
        isPrivate: { type: boolean }
    RouteSummary:
      type: object
      required: [id, name, activityType, isTourist, isScenic, reviewCount, owner, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        activityType:
          $ref: '#/components/schemas/ActivityType'
        isTourist: { type: boolean }
        isScenic: { type: boolean }
        isPublic: { type: boolean }
        totalDistance:
          type: number
          format: double
          nullable: true
          description: Dystans w metrach
        durationSeconds: { type: integer, nullable: true }
        averageRating:
          type: number
          format: double
          nullable: true
          description: Średnia ocen (1–5), null gdy brak recenzji
        reviewCount: { type: integer }
        recommendationScore:
          type: number
          format: double
          nullable: true
          description: Wynik rankingu rekomendacji (np. średnia bayesowska)
        startPoint:
          $ref: '#/components/schemas/LatLng'
        thumbnailUrl: { type: string, format: uri, nullable: true }
        distanceFromQuery:
          type: number
          format: double
          nullable: true
          description: Odległość w metrach od punktu `lat`/`lng` z zapytania (tylko przy wyszukiwaniu)
        owner:
          $ref: '#/components/schemas/UserSummary'
        createdAt: { type: string, format: date-time }
    Route:
      allOf:
        - $ref: '#/components/schemas/RouteSummary'
        - type: object
          required: [geometry, photos]
          properties:
            description: { type: string, nullable: true }
            geometry:
              $ref: '#/components/schemas/GeoJsonLineString'
            photos:
              type: array
              items:
                $ref: '#/components/schemas/Photo'
    RouteCreate:
      type: object
      required: [name, activityType, isTourist, isScenic, isPublic]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 5000, nullable: true }
        activityType:
          $ref: '#/components/schemas/ActivityType'
        isTourist: { type: boolean }
        isScenic: { type: boolean }
        isPublic:
          type: boolean
          description: false = trasa prywatna, widoczna tylko dla właściciela (W19)
        activityId:
          type: integer
          format: int64
          description: Aktywność użytkownika, z której powstaje trasa
        geometry:
          $ref: '#/components/schemas/GeoJsonLineString'
        photos:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PhotoInput'
    RouteUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 5000, nullable: true }
        activityType:
          $ref: '#/components/schemas/ActivityType'
        isTourist: { type: boolean }
        isScenic: { type: boolean }
        isPublic: { type: boolean }
    RoutePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RouteSummary'
    GpsPoint:
      type: object
      required: [latitude, longitude, recordedAt, isReconstructed]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        altitude: { type: number, format: double, nullable: true, description: Metry n.p.m. }
        speed: { type: number, format: double, nullable: true, description: m/s }
        recordedAt: { type: string, format: date-time }
        isReconstructed:
          type: boolean
          default: false
          description: true = punkt odtworzony algorytmem po utracie sygnału GPS (nie zmierzony)
    ActivitySummary:
      type: object
      required: [id, type, startTime]
      properties:
        id: { type: integer, format: int64 }
        type:
          $ref: '#/components/schemas/ActivityType'
        routeId:
          type: integer
          format: int64
          nullable: true
          description: Trasa, po której użytkownik szedł; null dla aktywności spontanicznych
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time, nullable: true }
        distance: { type: number, format: double, nullable: true, description: Metry }
        durationSeconds: { type: integer, nullable: true }
        avgPace: { type: number, format: double, nullable: true, description: min/km }
        stepCount: { type: integer, nullable: true }
        isShared:
          type: boolean
          description: Czy aktywność jest udostępniona (domyślnie false, widzi ją tylko właściciel)
    Activity:
      allOf:
        - $ref: '#/components/schemas/ActivitySummary'
        - type: object
          properties:
            geometry:
              $ref: '#/components/schemas/GeoJsonLineString'
    ActivityCreate:
      type: object
      required: [clientId, type, startTime, endTime, points]
      properties:
        clientId:
          type: string
          format: uuid
          description: Generowany na telefonie, chroni przed duplikatami przy ponownej wysyłce
        type:
          $ref: '#/components/schemas/ActivityType'
        routeId:
          type: integer
          format: int64
          nullable: true
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        distance: { type: number, format: double, minimum: 0 }
        durationSeconds: { type: integer, minimum: 0 }
        avgPace: { type: number, format: double, minimum: 0 }
        stepCount: { type: integer, minimum: 0 }
        isShared:
          type: boolean
          default: false
          description: Udostępnij od razu po zapisaniu
        points:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/GpsPoint'
    ActivityPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ActivitySummary'
    Review:
      type: object
      required: [id, routeId, user, rating, photos, createdAt]
      properties:
        id: { type: integer, format: int64 }
        routeId: { type: integer, format: int64 }
        user:
          $ref: '#/components/schemas/UserSummary'
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        createdAt: { type: string, format: date-time }
    ReviewCreate:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000, nullable: true }
        photos:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PhotoInput'
    ReviewPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Review'
    FeedItem:
      type: object
      required: [id, type, createdAt, author, likeCount, commentCount, likedByMe]
      description: |
        Wypełnione są tylko pola pasujące do `type`: ROUTE_PUBLISHED (`route`), ACTIVITY (`activity`, a przy
        ukończeniu publicznej trasy także `route`), REVIEW (`route`, `review`), POI_COLLECTED (`poi`).
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [ROUTE_PUBLISHED, ACTIVITY, REVIEW, POI_COLLECTED]
        createdAt: { type: string, format: date-time }
        author:
          $ref: '#/components/schemas/UserSummary'
        route:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeedRoute'
        activity:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeedActivity'
        review:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeedReview'
        poi:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeedPoi'
        geometry:
          nullable: true
          description: Uproszczony obrys trasy albo aktywności (tolerancja ok. 20 m) do podglądu na karcie
          allOf:
            - $ref: '#/components/schemas/GeoJsonLineString'
        photoUrl: { type: string, format: uri, nullable: true, description: Zdjęcie trasy, oceny albo punktu }
        likeCount: { type: integer }
        commentCount: { type: integer }
        likedByMe: { type: boolean }
    FeedRoute:
      type: object
      required: [id, name, activityType]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        activityType:
          $ref: '#/components/schemas/ActivityType'
        totalDistance: { type: number, format: double, nullable: true, description: Metry }
        durationSeconds: { type: integer, nullable: true }
    FeedActivity:
      type: object
      required: [id, type]
      properties:
        id: { type: integer, format: int64 }
        type:
          $ref: '#/components/schemas/ActivityType'
        distance: { type: number, format: double, nullable: true, description: Metry }
        durationSeconds: { type: integer, nullable: true }
        avgPace: { type: number, format: double, nullable: true, description: min/km }
    FeedReview:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
    FeedPoi:
      type: object
      required: [id, name, category]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category:
          $ref: '#/components/schemas/PoiCategory'
    FeedPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FeedItem'
    CommentCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
        replyToUserId:
          type: string
          format: uuid
          nullable: true
          description: Osoba, której komentarz odpowiada (autor wpisu albo ktoś, kto już komentował)
    Comment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        author:
          $ref: '#/components/schemas/UserSummary'
        replyTo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserSummary'
        body: { type: string }
        createdAt: { type: string, format: date-time }
    CommentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
    Poi:
      type: object
      required: [id, name, latitude, longitude, category]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        photoUrl: { type: string, format: uri, nullable: true }
        category:
          $ref: '#/components/schemas/PoiCategory'
    PoiAdmin:
      allOf:
        - $ref: '#/components/schemas/Poi'
        - type: object
          required: [status, createdAt]
          properties:
            status:
              $ref: '#/components/schemas/PoiStatus'
            submittedBy:
              $ref: '#/components/schemas/UserSummary'
            rejectionReason: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
    PoiCreate:
      type: object
      required: [name, description, latitude, longitude]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        photo:
          $ref: '#/components/schemas/PhotoInput'
        category:
          $ref: '#/components/schemas/PoiCategory'
    PoiUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        photo:
          $ref: '#/components/schemas/PhotoInput'
        category:
          $ref: '#/components/schemas/PoiCategory'
    PoiAdminPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PoiAdmin'
    CollectRequest:
      allOf:
        - $ref: '#/components/schemas/LatLng'
      description: Aktualna pozycja użytkownika
    PoiCollectionEntry:
      type: object
      required: [poi, collectedAt]
      properties:
        poi:
          $ref: '#/components/schemas/Poi'
        collectedAt: { type: string, format: date-time }
    RejectRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          required: [status]
          properties:
            status:
              $ref: '#/components/schemas/UserStatus'
    AdminUserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'