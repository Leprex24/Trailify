openapi: 3.0.3
info:
  title: Trailify API
  version: 0.1.0
  description: |
    Kontrakt API między aplikacją Android a backendem Trailify (Spring Boot).
    Wersja robocza (szkic z etapu 0). Zmiany w tym pliku wchodzą przez Pull Request
    zatwierdzony przez obie osoby.

    ## Konwencje
    - Wszystkie adresy mają prefiks `/api/v1` (patrz `servers`).
    - Uwierzytelnianie: nagłówek `Authorization: Bearer <JWT z Supabase Auth>`.
      Endpointy publiczne mają `security: []` i działają bez tokena.
    - Czas: ISO 8601 w UTC (`2026-10-20T14:30:00Z`).
    - Dystans w **metrach**, czas w **sekundach**, tempo w **min/km**, prędkość w **m/s**.
    - Identyfikatory encji (trasa, aktywność, recenzja, POI) to `int64`.
      Identyfikator użytkownika to UUID (taki sam jak `auth.users.id` w Supabase).
    - Geometria to GeoJSON `LineString`. Kolejność współrzędnych: `[longitude, latitude]`
      (lub `[longitude, latitude, altitude]`).
    - Paginacja: parametry `page` (od 0) i `size` (domyślnie 20, maks. 100).

    ## Zdjęcia
    Aplikacja wgrywa plik **bezpośrednio do Supabase Storage** do ścieżki
    `<bucket>/<userId>/<uuid>.<ext>` (buckety: `avatars`, `route-photos`,
    `review-photos`, `poi-photos`), a do API wysyła tylko `storageKey` i `url`.
    Backend odrzuca `storageKey`, który nie zaczyna się od identyfikatora zalogowanego
    użytkownika.

    ## Podział odpowiedzialności
    Pole `x-owner` przy operacji wskazuje, kto implementuje endpoint po stronie backendu.
  contact:
    name: Zespół Trailify
servers:
  - url: http://localhost:8080/api/v1
    description: Lokalnie (Docker)
tags:
  - name: Konto
    description: Profil zalogowanego użytkownika (W25–W27)
  - name: Trasy
    description: Publikowanie, wyszukiwanie i przeglądanie tras (W2, W3, W16–W19)
  - name: Aktywności
    description: Zarejestrowane aktywności i ślad GPS (W14, W25)
  - name: Mapa
    description: Warstwy tematyczne mapy z OpenStreetMap (W1)
  - name: Recenzje
    description: Oceny i zdjęcia do ukończonych tras (W20, W21)
  - name: Oś czasu
    description: Wpisy osób obserwowanych, polubienia i komentarze
  - name: Ciekawe punkty
    description: Przeglądanie, zgłaszanie i zbieranie POI (W4, W22–W24)
  - name: Admin
    description: Moderacja treści i kont (W29–W34)
security:
  - bearerAuth: []
paths:
  /me:
    get:
      tags: [Konto]
      operationId: getMe
      summary: Profil zalogowanego użytkownika wraz ze statystykami
      x-owner: Mikołaj
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Konto]
      operationId: updateMe
      summary: Edycja danych konta (W26)
      x-owner: Mikołaj
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Zaktualizowany profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Konto]
      operationId: deleteMe
      summary: Usunięcie konta wraz ze wszystkimi danymi (W27)
      description: |
        Usuwa profil, aktywności, trasy, recenzje, zebrane punkty oraz pliki ze Storage
        i konto w Supabase Auth. Operacja nieodwracalna.
      x-owner: Mikołaj
      responses:
        '204':
          description: Konto usunięte
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/activities:
    get:
      tags: [Konto, Aktywności]
      operationId: getMyActivities
      summary: Historia aktywności zalogowanego użytkownika (W25)
      description: |
        Posortowana od najnowszej. Opcjonalny przedział czasu (np. jeden miesiąc do statystyk):
        `from` włącznie, `to` wyłącznie, obie wartości w UTC. Odwrócony albo pusty przedział daje 400.
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: from
          in: query
          required: false
          description: Początek przedziału (włącznie), ISO 8601 w UTC
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Koniec przedziału (wyłącznie), ISO 8601 w UTC
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Strona aktywności
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/routes:
    get:
      tags: [Konto, Trasy]
      operationId: getMyRoutes
      summary: Trasy zalogowanego użytkownika (publiczne i prywatne)
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona tras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/saved-routes:
    get:
      tags: [Konto, Trasy]
      operationId: getMySavedRoutes
      summary: Trasy zapisane gwiazdką przez zalogowanego użytkownika
      description: |
        Publiczne trasy innych osób, od ostatnio zapisanej. Trasa wycofana przez autora
        (ustawiona jako prywatna) znika z listy.
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona tras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/poi-collection:
    get:
      tags: [Konto, Ciekawe punkty]
      operationId: getMyPoiCollection
      summary: Punkty zebrane przez zalogowanego użytkownika (W24)
      x-owner: Mikołaj
      responses:
        '200':
          description: Lista zebranych punktów, od najnowszego
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoiCollectionEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users:
    get:
      tags: [Społeczność]
      operationId: searchUsers
      summary: Wyszukiwanie osób po nazwie
      description: |
        Fraza (`query`) ma od 2 do 50 znaków i jest szukana w nazwie wyświetlanej (bez rozróżniania wielkości liter).
        Najpierw nazwy zaczynające się od frazy, potem pozostałe alfabetycznie. Bez własnego konta i bez kont
        zablokowanych. Adresów e-mail nie przeszukuje ani nie zwraca. Profile prywatne też są na liście (nazwa
        i avatar są jawne).
      x-owner: Kacper
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 50 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona użytkowników
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/followers/{followerId}:
    delete:
      tags: [Społeczność]
      operationId: removeFollower
      summary: Usuń obserwującego
      description: |
        Wskazana osoba przestaje obserwować zalogowanego użytkownika (to nie jest odobserwowanie przez niego).
        Działa też, gdy takiej obserwacji nie było. Osoba może zaobserwować ponownie, jeśli profil nie jest prywatny.
      x-owner: Kacper
      parameters:
        - name: followerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Osoba nie obserwuje już zalogowanego użytkownika
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{userId}/activities:
    get:
      tags: [Społeczność]
      operationId: getUserActivities
      summary: Udostępnione aktywności użytkownika
      description: |
        Tylko aktywności z `isShared = true` (domyślnie aktywności są prywatne), od najnowszych.
        Dla profilu prywatnego cudzego 403 `PRIVATE_PROFILE`.
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona aktywności
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}:
    get:
      tags: [Społeczność]
      operationId: getUser
      summary: Profil innego użytkownika (albo własny)
      description: |
        Nazwa, avatar i tło są widoczne zawsze. `stats` (bez e-maila, aktywności i zebranych punktów)
        jest `null`, gdy profil jest prywatny i nie należy do oglądającego. Zablokowane i nieistniejące
        konta to 404.
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/follow:
    put:
      tags: [Społeczność]
      operationId: followUser
      summary: Zacznij obserwować użytkownika
      description: |
        Ponowne obserwowanie niczego nie zmienia (204). Samego siebie obserwować nie można (409 `SELF_FOLLOW`),
        a profil prywatny można zacząć obserwować tylko jeśli już się go obserwuje (403 `PRIVATE_PROFILE`).
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Obserwujesz
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Społeczność]
      operationId: unfollowUser
      summary: Przestań obserwować użytkownika
      description: Działa zawsze, także gdy nie obserwowałeś (wynik ten sam).
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Nie obserwujesz
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{userId}/followers:
    get:
      tags: [Społeczność]
      operationId: getFollowers
      summary: Kto obserwuje użytkownika
      description: Od najnowszych. Dla profilu prywatnego cudzego 403 `PRIVATE_PROFILE`.
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona użytkowników
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/following:
    get:
      tags: [Społeczność]
      operationId: getFollowing
      summary: Kogo obserwuje użytkownik
      description: Od najnowszych. Dla profilu prywatnego cudzego 403 `PRIVATE_PROFILE`.
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona użytkowników
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/routes:
    get:
      tags: [Społeczność, Trasy]
      operationId: getUserRoutes
      summary: Publiczne trasy użytkownika
      description: Od najnowszej. Dla profilu prywatnego cudzego 403 `PRIVATE_PROFILE`.
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona tras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/poi-collection:
    get:
      tags: [Społeczność, Ciekawe punkty]
      operationId: getUserPoiCollection
      summary: Punkty zebrane przez użytkownika
      description: Od najnowszego. Dla profilu prywatnego cudzego 403 `PRIVATE_PROFILE`.
      x-owner: Kacper
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Lista zebranych punktów
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoiCollectionEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /routes:
    get:
      tags: [Trasy]
      operationId: searchRoutes
      summary: Wyszukiwanie opublikowanych tras (W2, W3)
      description: |
        Zwraca tylko trasy publiczne. Parametry `lat`, `lng` i `radiusKm` podaje się razem.
        Przy `sort=nearest` wymagane są `lat` i `lng`.
        Sortowanie `recommended` używa pola `recommendationScore` liczonego na podstawie
        ocen i ich liczby (średnia bayesowska, widok `route_rating_stats` w bazie).
        Sortowanie `distance` zwraca od najkrótszej trasy, `nearest` od najbliższej punktowi
        `lat`/`lng` (odległość do najbliższego punktu trasy, pole `distanceFromQuery`).
        Gdy podano `lat` i `lng`, wyniki są ograniczone do promienia `radiusKm` (domyślnie 10 km).
        Cel wydajnościowy: odpowiedź poniżej 2 s.
      security: []
      x-owner: Kacper
      parameters:
        - name: lat
          in: query
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          schema: { type: number, format: double, minimum: 0.1, maximum: 200, default: 10 }
        - name: activityType
          in: query
          description: Jeden lub kilka typów, np. `activityType=CYCLING,WALKING`
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ActivityType'
        - name: minDistance
          in: query
          description: Minimalny dystans w metrach
          schema: { type: number, format: double, minimum: 0 }
        - name: maxDistance
          in: query
          description: Maksymalny dystans w metrach
          schema: { type: number, format: double, minimum: 0 }
        - name: minRating
          in: query
          schema: { type: number, format: double, minimum: 1, maximum: 5 }
        - name: isTourist
          in: query
          schema: { type: boolean }
        - name: isScenic
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: Fragment nazwy trasy
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recommended, rating, newest, nearest, distance]
            default: recommended
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona wyników
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Trasy]
      operationId: createRoute
      summary: Publikacja trasy (W16–W19)
      description: |
        Trasę tworzy się z zarejestrowanej aktywności (`activityId`, geometria jest
        kopiowana z aktywności) albo z samej geometrii (`geometry`, np. trasa
        zaplanowana na mapie). Należy podać dokładnie jedno z tych dwóch pól.
        Dystans backend liczy sam z geometrii, czas kopiuje z aktywności (dla samej
        geometrii jest `null`). Trasa krótsza niż 10 m jest odrzucana.
        Zdjęcia najpierw wysyła aplikacja do Supabase Storage, tu trafiają tylko
        `storageKey` (musi zaczynać się od identyfikatora użytkownika i `/`) oraz `url` (https).
      x-owner: Kacper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreate'
      responses:
        '201':
          description: Trasa utworzona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /routes/{routeId}:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    get:
      tags: [Trasy]
      operationId: getRoute
      summary: Szczegóły trasy wraz z geometrią i zdjęciami (W2)
      description: |
        Trasa prywatna jest widoczna tylko dla właściciela (W19). Dla pozostałych
        użytkowników odpowiedź to `404`.
      security: []
      x-owner: Kacper
      responses:
        '200':
          description: Trasa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Trasy]
      operationId: updateRoute
      summary: Edycja metadanych trasy (tylko właściciel)
      description: Geometrii nie można zmienić po publikacji.
      x-owner: Kacper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpdate'
      responses:
        '200':
          description: Zaktualizowana trasa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Trasy, Admin]
      operationId: deleteRoute
      summary: Usunięcie trasy (właściciel lub administrator, W33)
      x-owner: Kacper
      responses:
        '204':
          description: Trasa usunięta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /routes/{routeId}/saved:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    get:
      tags: [Trasy]
      operationId: getRouteSaved
      summary: Czy zalogowany użytkownik zapisał tę trasę gwiazdką
      x-owner: Kacper
      responses:
        '200':
          description: Stan zapisu
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Trasy]
      operationId: saveRoute
      summary: Zapisanie trasy gwiazdką
      description: |
        Można zapisać publiczną trasę innej osoby. Ponowne zapisanie nic nie zmienia.
        Własna trasa daje `409` z kodem `OWN_ROUTE`, a cudza prywatna `404`.
      x-owner: Kacper
      responses:
        '204':
          description: Trasa zapisana
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Trasy]
      operationId: unsaveRoute
      summary: Odznaczenie zapisanej trasy
      description: Działa zawsze, także gdy trasy nie było na liście zapisanych.
      x-owner: Kacper
      responses:
        '204':
          description: Trasa nie jest już zapisana
        '401':
          $ref: '#/components/responses/Unauthorized'
  /routes/{routeId}/reviews:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    get:
      tags: [Recenzje]
      operationId: listReviews
      summary: Recenzje trasy (W2)
      description: Dla tras prywatnych zwraca `404` (jak `getRoute`).
      security: []
      x-owner: Mikołaj
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Strona recenzji, od najnowszej
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Recenzje]
      operationId: createReview
      summary: Dodanie oceny i zdjęć do trasy (W20, W21)
      description: |
        Dozwolone tylko, jeśli użytkownik ukończył trasę, czyli ma zapisaną aktywność
        z `routeId` równym tej trasie. W przeciwnym razie `403` z kodem `ROUTE_NOT_COMPLETED`.
        Jeden użytkownik może ocenić trasę tylko raz (`409` z kodem `ALREADY_REVIEWED`).
        Właściciel nie ocenia własnej trasy (`403` z kodem `OWN_ROUTE`).
        Klucze zdjęć muszą zaczynać się od identyfikatora użytkownika (jak przy trasach).
      x-owner: Mikołaj
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: Recenzja dodana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reviews/{reviewId}:
    delete:
      tags: [Recenzje, Admin]
      operationId: deleteReview
      summary: Usunięcie recenzji (autor lub administrator, W33)
      x-owner: Mikołaj
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Recenzja usunięta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /routing/plan:
    post:
      tags: [Trasy]
      operationId: planRoute
      summary: Wyznaczenie trasy po drogach i ścieżkach przez podane punkty (W1)
      description: |
        Aplikacja wysyła punkty zaznaczone na mapie (start, punkty pośrednie, koniec), a backend
        prosi o trasę silnik GraphHopper (dane OpenStreetMap). Rower używa profilu rowerowego,
        bieg i spacer pieszego. Czas biegu liczony jest jako połowa czasu spaceru.
      x-owner: Kacper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePlanRequest'
      responses:
        '200':
          description: Trasa poprowadzona przez wszystkie punkty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Nie znaleziono trasy między punktami (`ROUTE_NOT_FOUND`), np. punkt poza obszarem danych
        '503':
          description: Silnik tras niedostępny (`ROUTING_UNAVAILABLE`)
  /map-layers/{type}:
    get:
      tags: [Mapa]
      operationId: getMapLayer
      summary: Linie warstwy mapy w prostokącie (W1)
      description: |
        Ścieżki rowerowe, szlaki piesze i ścieżki leśne z OpenStreetMap. Backend pobiera je z własnego serwera
        Overpass (dane województwa lubelskiego), upraszcza linie (tolerancja ok. 2 m) i pamięta odpowiedzi
        w pamięci na kilka godzin. Aplikacja prosi o kafelki na stałej siatce. Gdy backend jest niedostępny
        (`503 MAP_LAYER_UNAVAILABLE` albo brak połączenia), aplikacja awaryjnie pobiera te same dane
        z publicznych serwerów Overpass.
      x-owner: Kacper
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [CYCLE_PATHS, HIKING_TRAILS, FOREST_PATHS]
        - { name: minLat, in: query, required: true, schema: { type: number, format: double } }
        - { name: minLng, in: query, required: true, schema: { type: number, format: double } }
        - { name: maxLat, in: query, required: true, schema: { type: number, format: double } }
        - name: maxLng
          in: query
          required: true
          description: Prostokąt może mieć najwyżej 0,2 stopnia szerokości geograficznej i 0,3 długości geograficznej
          schema: { type: number, format: double }
      responses:
        '200':
          description: Linie leżące w prostokącie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapLayerLines'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Serwer Overpass niedostępny (`MAP_LAYER_UNAVAILABLE`)
  /activities:
    post:
      tags: [Aktywności]
      operationId: createActivity
      summary: Zapis zakończonej aktywności wraz ze śladem GPS (W14)
      description: |
        Aplikacja zapisuje aktywność lokalnie w Room i wysyła ją po zakończeniu
        (lub później, gdy wróci internet). `clientId` to UUID generowany na telefonie.
