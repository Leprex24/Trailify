  /pois/{poiId}/collect:
    parameters:
      - $ref: '#/components/parameters/PoiId'
    post:
      tags: [Ciekawe punkty]
      operationId: collectPoi
      summary: Zebranie punktu, gdy użytkownik jest w jego pobliżu (W23)
      description: |
        Telefon wykrywa bliskość lokalnie (funkcja `nearbyPois`) i wysyła aktualną
        pozycję. Backend sprawdza odległość (maks. 50 m) i odrzuca zbyt odległe pozycje
        kodem `422 POI_TOO_FAR`. Ponowne zebranie tego samego punktu zwraca `409` z kodem `ALREADY_COLLECTED`.
      x-owner: Mikołaj
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectRequest'
      responses:
        '201':
          description: Punkt zebrany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoiCollectionEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Użytkownik jest za daleko od punktu (`POI_TOO_FAR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
