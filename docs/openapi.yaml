        zamiast duplikatu.
      x-owner: Kacper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityCreate'
      responses:
        '201':
          description: Aktywność zapisana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '200':
          description: Aktywność o tym `clientId` już istnieje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      tags: [Aktywności]
      operationId: getActivity
      summary: Szczegóły aktywności (własna albo udostępniona)
      description: |
        Własną aktywność widać zawsze. Cudzą tylko wtedy, gdy jest udostępniona (`isShared`) i profil właściciela
        nie jest prywatny; w innym wypadku 404.
      x-owner: Kacper
      responses:
        '200':
