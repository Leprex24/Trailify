# Lokalna baza PostgreSQL z PostGIS (opcjonalna; domyślnie backend używa bazy z Supabase).
# Start:  docker compose up -d db
# Stop:   docker compose down        (dane zostają w wolumenie)
# Reset:  docker compose down -v     (usuwa dane, migracje wykonają się od nowa)
services:
  db:
    # Supabase działa na nowszym PostgreSQL, ale dla migracji różnica nie ma znaczenia (PG 15+).
    image: postgis/postgis:16-3.4
    container_name: trailify-db
    environment:
      POSTGRES_DB: trailify
      POSTGRES_USER: trailify
      POSTGRES_PASSWORD: trailify
    ports:
      - "5433:5432"
    volumes:
      - trailify-db-data:/var/lib/postgresql/data
      # skrypty z tego folderu wykonują się raz, przy tworzeniu pustej bazy
      - ./docker/local-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailify -d trailify"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Silnik tras (rower, bieg, spacer). Dane OSM: routing/download-data.sh, instrukcja: routing/README.md
  # Start:  docker compose up -d --build graphhopper
  graphhopper:
    build: ./routing
    container_name: trailify-graphhopper
    environment:
      OSM_PBF: lubelskie-latest.osm.pbf
      JAVA_OPTS: "-Xms512m -Xmx2g"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ./routing/data:/data

  # Własny serwer Overpass: warstwy mapy (ścieżki rowerowe, szlaki, ścieżki leśne) dla backendu.
  # Dane OSM: województwo lubelskie (to samo co w routingu). Pierwszy start pobiera dane i buduje bazę
  # (kilkanaście minut), potem baza zostaje w wolumenie. Instrukcja: overpass/README.md
  # Start:  docker compose up -d overpass
  overpass:
    image: wiktorn/overpass-api:latest
    container_name: trailify-overpass
    restart: unless-stopped
    environment:
      OVERPASS_MODE: init
      OVERPASS_META: "no"
      OVERPASS_PLANET_URL: https://download.geofabrik.de/europe/poland/lubelskie-latest.osm.bz2
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_COMPRESSION: gz
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - trailify-overpass-data:/db

  # Backend API. Klucze z pliku .env (w głównym folderze repo, poza Gitem).
  # Start:  docker compose up -d --build backend graphhopper
  backend:
    build: ./backend
    container_name: trailify-backend
    restart: unless-stopped
    env_file: .env
    environment:
      GRAPHHOPPER_URL: http://graphhopper:8989
      OVERPASS_URL: http://overpass:80
    depends_on:
      - graphhopper
      - overpass
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  trailify-db-data:
  trailify-overpass-data:
